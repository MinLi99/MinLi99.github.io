title: Min Li
# Comment out url when working locally to resolve base urls correctly
url: https://minli99.github.io

# Keep this hostname separate from url so forks do not inherit live tracking.
# When reusing this site, change BOTH values to your own GoatCounter site/domain.
goatcounter:
  endpoint: https://MinLi99-clean.goatcounter.com/count
  hostname: MinLi99.github.io

# Default social-share preview image (Open Graph / Twitter card). Lives in /images/.
og_image: og-cover.jpg

# Owner/author information
owner:
  name: Min Li
  avatar: avatar.jpg
  email: siming_deng_stat@163.com
  github: MinLi99
  linkedin: larry-deng-317b92360
  scholar: https://scholar.google.com/citations?hl=en&user=aKyLtgsAAAAJ
  researchgate: https://www.researchgate.net/profile/Siming-Deng-3

# https://search.google.com/search-console/ownership
google_verify: "SkiyuGpJOKT74vv5GmXLvYXXDkXy4v8VWPtbelYz3Hs"

# Links to include in top navigation
links:
  - title: About Me
    url: /
  - title: Research
    url: /publications/
  - title: Learning
    url: /learning/
  - title: Hobbies
    url: /hobbies/
  - title: Blog
    url: /blog/

# http://en.wikipedia.org/wiki/List_of_tz_database_time_zones
timezone: Asia/Shanghai
future: true
highlighter: rouge

# https://github.com/mojombo/jekyll/wiki/Permalinks
permalink: /:categories/:title

# Learning notes: every Markdown file in _learning/ is published at
# /learning/<filename>/ and listed automatically on /learning/.
collections:
  learning:
    output: true
    permalink: /learning/:path/

defaults:
  - scope:
      path: ""
      type: learning
    values:
      layout: page

kramdown:
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  enable_coderay: false
